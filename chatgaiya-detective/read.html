<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111418">
<title>চাটগাঁইয়া ডিটেকটিভ সিরিজ</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔎</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&family=JetBrains+Mono:wght@400;700&family=Noto+Serif+Bengali:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="reader">
<div class="pbar" id="pbar"></div>

<header class="top">
  <a class="brand" href="index.html"><span class="mark">🔎</span><span><b>চাটগাঁইয়া ডিটেকটিভ</b><small id="caseName"></small></span></a>
  <button class="icon" id="setBtn" aria-label="পড়ার সেটিং">Aa</button>
</header>

<main class="page" id="view"></main>

<nav class="bbar" aria-label="গল্পের নেভিগেশন">
  <button id="prevBtn"><span class="ic">‹</span>আগের</button>
  <button id="tocBtn"><span class="ic">☰</span><span id="tocLbl">সূচি</span></button>
  <button id="clueBtn"><span class="ic">📌</span>সূত্র<span class="badge" id="clueBadge" style="display:none">০</span></button>
  <button id="castBtn"><span class="ic">👥</span>চরিত্র</button>
  <button id="nextBtn"><span class="ic">›</span>পরের</button>
</nav>

<div class="veil" id="veil"></div>
<section class="sheet" id="tocSheet"><div class="grab"></div><h3>সূচি</h3><p class="hint">✓ = পড়া হয়েছে</p><ol class="toc" id="tocList"></ol></section>
<section class="sheet" id="cluesSheet"><div class="grab"></div><h3>📌 সূত্র তালিকা</h3><p class="hint" id="clueHint"></p><div class="board" id="clueList"></div></section>
<section class="sheet" id="castSheet"><div class="grab"></div><h3>👥 চরিত্র</h3><p class="hint">যতটুকু পড়েছেন, ততটুকু পর্যন্ত।</p><div class="cast" id="castList"></div></section>
<section class="sheet" id="setSheet"><div class="grab"></div><h3>পড়ার সেটিং</h3>
  <div class="set-row"><span>লেখার আকার <b id="fsVal"></b></span><span class="ctl"><button id="fsDown">অ−</button><button id="fsUp">অ+</button></span></div>
  <div class="set-row"><span>পাতার রং</span><span class="ctl"><button id="thDark">🌙 রাত</button><button id="thPaper">📄 কাগজ</button></span></div>
  <div class="set-row" style="border:none"><span>অগ্রগতি মুছুন</span><span class="ctl"><button id="resetBtn">↺</button></span></div>
</section>
<div class="toast" id="toast"></div>

<script src="series.js"></script>
<script src="assets/js/reader.js"></script>
</body>
</html>
